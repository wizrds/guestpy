[package]
name = "guestpy-rustpython"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
guestpy-core = { path = "../guestpy-core", version = "0.5.6", default-features = false }
thiserror = { workspace = true }

rustpython-vm = { git = "https://github.com/RustPython/RustPython", rev = "ea4e51d" }
rustpython-stdlib = { git = "https://github.com/RustPython/RustPython", rev = "ea4e51d" }
rustpython-pylib = { git = "https://github.com/RustPython/RustPython", rev = "ea4e51d", features = ["freeze-stdlib"] }

[features]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
